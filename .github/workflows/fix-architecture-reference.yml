name: Fix architecture asset reference

on:
  push:
    branches:
      - automation/architecture-readme-refresh

permissions:
  contents: write

jobs:
  fix-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fix repository tree reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("atlas-project-architecture.png", "atlas-project-architecture.webp")
          text = text.replace("| `ArchiveOS bridge` | 향후 상태/이벤트 관제 연동 | 현재는 구조만 준비 |\n\n\n## Repository Structure", "| `ArchiveOS bridge` | 향후 상태/이벤트 관제 연동 | 현재는 구조만 준비 |\n\n## Repository Structure")
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/fix-architecture-reference.yml

      - name: Commit README reference fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: fix architecture asset reference"
          git push origin HEAD:automation/architecture-readme-refresh
