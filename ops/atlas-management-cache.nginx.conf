# Keep the portal shell fresh so navigation and service ordering changes appear immediately.
location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/atlas-security-headers.conf;
}

location = /index.html {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/atlas-security-headers.conf;
}
